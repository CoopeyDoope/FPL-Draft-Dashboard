<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>FPL Draft H2H — The Charles Rice Invitational</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0f19;--s1:#121829;--s2:#1a2138;--s3:#222b45;--acc:#00ff87;--cyan:#04f5ff;--red:#ff4757;--amber:#fbbf24;--text:#e8ecf4;--t2:#6e7d9a;--t3:#3d4a66}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{font-family:inherit;cursor:pointer;border:none;outline:none;-webkit-tap-highlight-color:transparent}
.app{min-height:100vh;max-width:600px;margin:0 auto}
.hdr{padding:14px 16px 0;border-bottom:1px solid var(--s2)}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.logo{font-size:18px;font-weight:900;letter-spacing:-.3px}
.league-sub{color:var(--t2);font-size:11px;margin-top:2px}
.h2h-pill{font-size:10px;color:var(--bg);background:var(--acc);padding:2px 8px;border-radius:12px;font-weight:800;margin-left:6px;vertical-align:middle}
.refresh-btn{background:var(--s1);border:1px solid var(--s2);color:var(--t2);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.refresh-btn:active{background:var(--s2)}
.refresh-btn.spinning svg{animation:spin .6s linear}
.gw-row{display:flex;align-items:center;gap:5px;margin:10px 0;flex-wrap:wrap}
.gw-chip{min-width:28px;height:26px;border-radius:6px;font-weight:700;font-size:11px;transition:all .12s;display:flex;align-items:center;justify-content:center}
.gw-chip.on{background:var(--acc);color:var(--bg)}.gw-chip.off{background:var(--s1);color:var(--t2)}
.gw-label{color:var(--t2);font-size:11px;font-weight:600;margin-left:4px;display:flex;align-items:center;gap:5px}
.gw-badge{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.gw-badge.live{background:rgba(0,255,135,.15);color:var(--acc)}.gw-badge.final{background:rgba(110,125,154,.15);color:var(--t2)}
.tabs{display:flex;gap:3px;padding-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:7px 13px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.8px;border-radius:7px;white-space:nowrap;transition:all .12s}
.tab.on{background:var(--acc);color:var(--bg)}.tab.off{background:transparent;color:var(--t2)}
.cnt{padding:14px 16px 80px;animation:fadeUp .25s ease}
.card{background:var(--s1);border-radius:12px;border:1px solid var(--s2);overflow:hidden}
.match{padding:14px;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.match:active{background:var(--s2)}
.match-teams{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.match-side{flex:1;text-align:center}
.match-name{font-size:11px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-pts{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.match-vs{color:var(--t3);font-size:12px;font-weight:700;padding:0 6px}
.bar-track{display:flex;height:3px;border-radius:2px;background:var(--s3);gap:2px;overflow:hidden}
.bar-fill{height:100%;transition:width .4s ease}
.live-dot{display:flex;align-items:center;gap:4px;position:absolute;top:10px;right:12px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:pulse 1.4s infinite}
.live-txt{font-size:9px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.expand{background:var(--s2);padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--s3)}
.exp-title{font-size:10px;font-weight:700;color:var(--acc);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.pl-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid rgba(34,43,69,.5);font-size:11px}
.pl-left{display:flex;align-items:center;gap:5px;min-width:0}
.pos-tag{font-size:8px;font-weight:800;padding:1px 4px;border-radius:3px;min-width:26px;text-align:center;flex-shrink:0}
.pl-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-pts{font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;margin-left:4px}
.sub-in{background:rgba(0,255,135,.08);border-radius:4px;padding:0 3px}
.sub-out{opacity:.35;text-decoration:line-through}
.sub-arrow{font-size:8px;margin-left:2px}
.avg-team{font-style:italic;opacity:.5}
.awards{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.award{background:var(--s1);border-radius:10px;padding:12px 14px;border:1px solid var(--s2);display:flex;align-items:center;gap:10px}
.award-icon{font-size:22px;flex-shrink:0}
.award-label{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.award-val{font-size:14px;font-weight:800}
.stat-card{background:var(--s1);border-radius:10px;padding:14px;border:1px solid var(--s2)}
.stat-icon{font-size:22px;margin-bottom:3px}
.stat-label{color:var(--t2);font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-bottom:2px}
.stat-val{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.stat-sub{color:var(--t2);font-size:11px;margin-top:2px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:11px}
th{padding:7px 5px;color:var(--t2);font-weight:700;font-size:9px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--s2);white-space:nowrap}
td{padding:8px 5px;border-bottom:1px solid var(--s2)}
.form-dots{display:flex;gap:3px;justify-content:center}
.fdot{width:7px;height:7px;border-radius:50%}
.bench-row{background:var(--s1);border-radius:8px;padding:9px 12px;border:1px solid var(--s2);display:flex;justify-content:space-between;align-items:center;font-size:12px}
.h2h-cell{padding:5px;text-align:center;font-size:10px;white-space:nowrap}
.section{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.load-btn{background:var(--s2);color:var(--acc);border:1px solid var(--s3);border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;width:100%;margin-top:8px}
.load-btn:active{background:var(--s3)}
.spinner{width:32px;height:32px;border:3px solid var(--s2);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:12px}
.err-box{background:var(--s1);border:1px solid var(--red);border-radius:12px;padding:20px;text-align:center;margin:20px 16px}
.retry{background:var(--acc);color:var(--bg);border-radius:8px;padding:10px 24px;font-weight:700;font-size:14px;margin-top:10px}
.footer{text-align:center;padding:20px 16px;color:var(--t3);font-size:10px;position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,var(--bg) 40%);pointer-events:none}
.tap-hint{text-align:center;font-size:9px;color:var(--t3);margin-top:6px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useCallback} = React;

// ═══ CONFIG ══════════════════════════════════════════════════
const LEAGUE_ID = 15656;
const API_BASE = 'https://draft.premierleague.com/api';
const POS = {1:'GKP',2:'DEF',3:'MID',4:'FWD'};
const POS_C = {GKP:'#fbbf24',DEF:'#04f5ff',MID:'#a78bfa',FWD:'#ff4757'};

// ═══ MULTI-PROXY API ════════════════════════════════════════
const PROXIES = [
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://corsproxy.io/?'+encodeURIComponent(u),
  u=>'https://thingproxy.freeboard.io/fetch/'+u,
  u=>'https://proxy.cors.sh/'+u,
  u=>u
];
let px = null;
async function api(ep){
  const t=API_BASE+ep;
  if(px!==null){try{const r=await fetch(PROXIES[px](t),{signal:AbortSignal.timeout(12000)});if(r.ok){const d=await r.json();return d}}catch(e){px=null}}
  for(let i=0;i<PROXIES.length;i++){
    try{
      const r=await fetch(PROXIES[i](t),{signal:AbortSignal.timeout(12000)});
      if(r.ok){const txt=await r.text();const d=JSON.parse(txt);px=i;console.log('Using proxy #'+i);return d}
    }catch(e){continue}
  }
  throw new Error('All proxies failed');
}

// ═══ AUTO-SUB ENGINE ════════════════════════════════════════
function calcTeam(picks, live, bs){
  if(!picks||!live||!bs) return null;
  // Figure out which teams have kicked off (any player from that team has minutes > 0)
  const teamsPlayed=new Set();
  if(bs.elements){bs.elements.forEach(el=>{const lv=live[el.id];if(lv&&(lv.minutes>0))teamsPlayed.add(el.team)})}
  const info = p=>{
    const el=bs.elements?.find(e=>e.id===p.element);
    const lv=live[p.element];
    return{...p,type:el?.element_type||0,team:el?.team||0,mins:lv?.minutes||0,pts:lv?.total_points||0,name:el?.web_name||'?',subIn:false,subOut:false};
  };
  const st=picks.filter(p=>p.position<=11).map(info);
  const bn=picks.filter(p=>p.position>11).sort((a,b)=>a.position-b.position).map(info);
  const usedB=new Set(), outS=new Set();
  for(let si=0;si<st.length;si++){
    if(st[si].mins>0) continue; // played, no sub needed
    if(!teamsPlayed.has(st[si].team)) continue; // team hasn't kicked off yet, don't sub
    for(let bi=0;bi<bn.length;bi++){
      if(usedB.has(bi)||bn[bi].mins===0) continue;
      if((st[si].type===1)!==(bn[bi].type===1)) continue;
      const team=[];
      st.forEach((s,i)=>{if(i!==si&&!outS.has(i))team.push(s)});
      usedB.forEach(i=>team.push(bn[i]));
      team.push(bn[bi]);
      const c={1:0,2:0,3:0,4:0};
      team.forEach(p=>{c[p.type]=(c[p.type]||0)+1});
      if(c[1]>=1&&c[2]>=3&&c[3]>=2&&c[4]>=1){
        st[si].subOut=true;bn[bi].subIn=true;outS.add(si);usedB.add(bi);break;
      }
    }
  }
  let total=0;st.forEach((s,i)=>{if(!outS.has(i))total+=s.pts});usedB.forEach(i=>{total+=bn[i].pts});
  return{starters:st,bench:bn,total};
}

// ═══ HELPERS ════════════════════════════════════════════════
function isAvg(e){return((e?.player_first_name||'')+(e?.player_last_name||'')+(e?.entry_name||'')).toLowerCase().includes('average')||(e?.entry_name==='Manager')}
function getName(e){return e?.entry_name||`${e?.player_first_name||''} ${e?.player_last_name||''}`.trim()||'Team'}
function getShort(e){return e?.short_name||getName(e).substring(0,3).toUpperCase()}
function displayName(e){return isAvg(e)?'League Average':getName(e)}

// ═══ APP ════════════════════════════════════════════════════
function App(){
  const [tab,setTab]=useState('live');
  const [gw,setGw]=useState(null);
  const [maxGw,setMaxGw]=useState(1);
  const [loading,setLoading]=useState(true);
  const [refreshing,setRefreshing]=useState(false);
  const [error,setError]=useState(null);
  const [league,setLeague]=useState(null);
  const [entries,setEntries]=useState([]);
  const [standings,setStandings]=useState([]);
  const [allMatches,setAllMatches]=useState([]);
  const [bootstrap,setBootstrap]=useState(null);
  const [liveData,setLiveData]=useState({});
  const [picks,setPicks]=useState({});
  const [expanded,setExpanded]=useState(null);
  const [picksLoading,setPicksLoading]=useState({});
  const [lastRefresh,setLastRefresh]=useState(null);
  const [curEvent,setCurEvent]=useState(1);

  // ── Load ───────────────────────────────────────────────────
  const loadData = useCallback(async(isRefresh)=>{
    try{
      if(isRefresh)setRefreshing(true);else setLoading(true);
      setError(null);
      const[game,bs,ld]=await Promise.all([api('/game'),api('/bootstrap-static'),api('/league/'+LEAGUE_ID+'/details')]);
      setBootstrap(bs);setLeague(ld.league);setEntries(ld.league_entries||[]);setStandings(ld.standings||[]);setAllMatches(ld.matches||[]);
      const cur=game.current_event||game.next_event||1;
      setCurEvent(cur);
      const ms=ld.matches||[];
      const mx=Math.max(cur,...ms.filter(m=>m.started||m.finished).map(m=>m.event),1);
      setMaxGw(mx);setGw(prev=>prev||cur);
      // Live player data
      try{
        const lv=await api('/event/'+cur+'/live');
        const map={};
        if(lv.elements){if(Array.isArray(lv.elements))lv.elements.forEach(el=>{map[el.id]=el.stats});else Object.entries(lv.elements).forEach(([id,el])=>{map[parseInt(id)]=el.stats||el})}
        setLiveData(prev=>({...prev,...map}));
      }catch(e){}
      // Picks for current GW
      const le=ld.league_entries||[];
      const curMs=ms.filter(m=>m.event===cur);
      const pu={};
      const eids=new Set();
      curMs.forEach(m=>{
        const e1=le.find(e=>e.id===m.league_entry_1),e2=le.find(e=>e.id===m.league_entry_2);
        if(e1)eids.add(JSON.stringify({lid:m.league_entry_1,eid:e1.entry_id}));
        if(e2)eids.add(JSON.stringify({lid:m.league_entry_2,eid:e2.entry_id}));
      });
      for(const raw of eids){const{lid,eid}=JSON.parse(raw);try{const pd=await api('/entry/'+eid+'/event/'+cur);pu[lid+'-'+cur]=pd.picks||[]}catch(e){}}
      setPicks(prev=>({...prev,...pu}));
      setLoading(false);setRefreshing(false);setLastRefresh(new Date());
    }catch(err){console.error(err);setError('Could not load league data. Tap Retry.');setLoading(false);setRefreshing(false)}
  },[]);
  useEffect(()=>{loadData(false)},[loadData]);

  // ── Load match picks on expand ─────────────────────────────
  async function loadMatchPicks(m){
    const e1=entries.find(e=>e.id===m.league_entry_1),e2=entries.find(e=>e.id===m.league_entry_2);
    if(!e1||!e2)return;
    const k1=m.league_entry_1+'-'+m.event,k2=m.league_entry_2+'-'+m.event;
    if(picks[k1]&&picks[k2])return;
    setPicksLoading(p=>({...p,[k1]:true,[k2]:true}));
    try{
      const[p1,p2]=await Promise.all([api('/entry/'+e1.entry_id+'/event/'+m.event),api('/entry/'+e2.entry_id+'/event/'+m.event)]);
      try{const lv=await api('/event/'+m.event+'/live');const map={};if(lv.elements){if(Array.isArray(lv.elements))lv.elements.forEach(el=>{map[el.id]=el.stats});else Object.entries(lv.elements).forEach(([id,el])=>{map[parseInt(id)]=el.stats||el})}setLiveData(prev=>({...prev,...map}))}catch(e){}
      setPicks(prev=>({...prev,[k1]:p1.picks||[],[k2]:p2.picks||[]}));
    }catch(e){console.warn(e)}
    setPicksLoading(p=>({...p,[k1]:false,[k2]:false}));
  }

  // ── Load all bench data ────────────────────────────────────
  // ── Derived ────────────────────────────────────────────────
  const gwMatches=useMemo(()=>allMatches.filter(m=>m.event===gw),[allMatches,gw]);
  const finishedMatches=useMemo(()=>allMatches.filter(m=>m.finished),[allMatches]);
  const gwIsLive=useMemo(()=>gw===curEvent&&gwMatches.some(m=>m.started&&!m.finished),[gw,curEvent,gwMatches]);
  const gwIsFinished=useMemo(()=>gwMatches.length>0&&gwMatches.every(m=>m.finished),[gwMatches]);
  const gwNotStarted=useMemo(()=>gwMatches.length>0&&gwMatches.every(m=>!m.started),[gwMatches]);

  const managerResults=useMemo(()=>{
    const res={};entries.forEach(e=>{res[e.id]=[]});
    [...finishedMatches].sort((a,b)=>a.event-b.event).forEach(m=>{
      const p1=m.league_entry_1_points,p2=m.league_entry_2_points;
      if(res[m.league_entry_1])res[m.league_entry_1].push(p1>p2?'W':p1<p2?'L':'D');
      if(res[m.league_entry_2])res[m.league_entry_2].push(p2>p1?'W':p2<p1?'L':'D');
    });
    return res;
  },[finishedMatches,entries]);

  const enrichedStandings=useMemo(()=>{
    return standings.map(s=>{
      const results=managerResults[s.league_entry]||[];
      const finMs=finishedMatches.filter(m=>m.league_entry_1===s.league_entry||m.league_entry_2===s.league_entry);
      let pf=0,pa=0;finMs.forEach(m=>{const is1=m.league_entry_1===s.league_entry;pf+=is1?m.league_entry_1_points:m.league_entry_2_points;pa+=is1?m.league_entry_2_points:m.league_entry_1_points});
      const gp=finMs.length||1;
      return{...s,results,pf,pa,diff:pf-pa,avg:(pf/gp).toFixed(1),gp};
    }).sort((a,b)=>(b.matches_won*3+b.matches_drawn)-(a.matches_won*3+a.matches_drawn)||b.pf-a.pf);
  },[standings,managerResults,finishedMatches]);

  const records=useMemo(()=>{
    let hi={s:0},lo={s:Infinity},big={m:0};
    finishedMatches.forEach(m=>{
      const p1=m.league_entry_1_points,p2=m.league_entry_2_points;
      [{id:m.league_entry_1,s:p1},{id:m.league_entry_2,s:p2}].forEach(t=>{
        if(t.s>hi.s)hi={id:t.id,s:t.s,gw:m.event};
        if(t.s<lo.s&&t.s>0)lo={id:t.id,s:t.s,gw:m.event};
      });
      const mg=Math.abs(p1-p2);
      if(mg>big.m){big={id:p1>p2?m.league_entry_1:m.league_entry_2,m:mg,gw:m.event,sc:`${Math.max(p1,p2)}-${Math.min(p1,p2)}`}}
    });
    if(lo.s===Infinity)lo={s:'–'};
    return{hi,lo,big};
  },[finishedMatches]);

  const gwAwards=useMemo(()=>{
    if(!gwIsFinished)return null;
    let best={s:0},closest={m:Infinity},biggest={m:0};
    gwMatches.forEach(m=>{
      const p1=m.league_entry_1_points,p2=m.league_entry_2_points;
      [{id:m.league_entry_1,s:p1},{id:m.league_entry_2,s:p2}].forEach(t=>{if(t.s>best.s)best={id:t.id,s:t.s}});
      const mg=Math.abs(p1-p2);
      if(mg<closest.m)closest={m:mg,sc:`${p1}-${p2}`,ids:[m.league_entry_1,m.league_entry_2]};
      if(mg>biggest.m)biggest={m:mg,sc:`${Math.max(p1,p2)}-${Math.min(p1,p2)}`,id:p1>p2?m.league_entry_1:m.league_entry_2};
    });
    return{best,closest,biggest};
  },[gwMatches,gwIsFinished]);

  const h2hGrid=useMemo(()=>{
    const g={};entries.forEach(a=>{g[a.id]={};entries.forEach(b=>{if(a.id!==b.id)g[a.id][b.id]={w:0,d:0,l:0}})});
    finishedMatches.forEach(m=>{
      const p1=m.league_entry_1_points,p2=m.league_entry_2_points,a=m.league_entry_1,b=m.league_entry_2;
      if(!g[a]?.[b])return;
      if(p1>p2){g[a][b].w++;g[b][a].l++}else if(p2>p1){g[b][a].w++;g[a][b].l++}else{g[a][b].d++;g[b][a].d++}
    });
    return g;
  },[finishedMatches,entries]);

  function getLive(lid,ev){const p=picks[lid+'-'+ev];if(!p)return null;const t=calcTeam(p,liveData,bootstrap);return t?t.total:null}
  function mgr(id){return entries.find(e=>e.id===id)}

  // ── Player Row ─────────────────────────────────────────────
  function PR({p}){
    const pos=POS[p.type]||'?',pc=POS_C[pos]||'#6e7d9a';
    return(
      <div className={'pl-row'+(p.subOut?' sub-out':'')+(p.subIn?' sub-in':'')}>
        <div className="pl-left">
          <span className="pos-tag" style={{color:pc,background:pc+'18'}}>{pos}</span>
          <span className="pl-name">{p.name}</span>
          {p.is_captain&&<span style={{fontSize:8,color:'var(--acc)',border:'1px solid var(--acc)',borderRadius:3,padding:'0 3px'}}>C</span>}
          {p.subOut&&<span className="sub-arrow" style={{color:'var(--red)'}}>▼</span>}
          {p.subIn&&<span className="sub-arrow" style={{color:'var(--acc)'}}>▲</span>}
        </div>
        <span className="pl-pts" style={{color:p.pts>6?'var(--acc)':p.pts===0?'var(--t3)':'var(--text)'}}>{p.pts}</span>
      </div>
    );
  }

  // ── Render ─────────────────────────────────────────────────
  if(loading)return<div className="center"><div className="spinner"/><div style={{color:'var(--t2)',fontSize:13}}>Loading league...</div></div>;
  if(error)return<div className="center"><div className="err-box"><div style={{fontSize:26,marginBottom:6}}>⚠️</div><div style={{color:'var(--red)',fontWeight:700,marginBottom:4}}>Connection Error</div><div style={{color:'var(--t2)',fontSize:12,lineHeight:1.4}}>{error}</div><button className="retry" onClick={()=>loadData(false)}>Retry</button></div></div>;

  return(
    <div className="app">
      <div className="hdr">
        <div className="hdr-top">
          <div>
            <div className="logo">⚽ FPL Draft<span className="h2h-pill">H2H</span></div>
            <div className="league-sub">{league?.name||'League'} — {entries.filter(e=>!isAvg(e)).length} managers</div>
          </div>
          <button className={'refresh-btn'+(refreshing?' spinning':'')} onClick={()=>loadData(true)}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
            {lastRefresh?lastRefresh.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Refresh'}
          </button>
        </div>
        <div className="gw-row">
          {Array.from({length:maxGw},(_,i)=><button key={i} className={'gw-chip '+(gw===i+1?'on':'off')} onClick={()=>{setGw(i+1);setExpanded(null)}}>{i+1}</button>)}
          <span className="gw-label">GW {gw}
            {gwIsLive&&<span className="gw-badge live">In Progress</span>}
            {gwIsFinished&&<span className="gw-badge final">Final</span>}
            {gwNotStarted&&<span className="gw-badge final">Upcoming</span>}
          </span>
        </div>
        <div className="tabs">
          {[['live','Live GW'],['standings','Standings'],['stats','Stats'],['h2h','H2H Grid']].map(([k,l])=>
            <button key={k} className={'tab '+(tab===k?'on':'off')} onClick={()=>setTab(k)}>{l}</button>
          )}
        </div>
      </div>

      <div className="cnt" key={tab+gw}>

        {/* ═══ LIVE GW ═══ */}
        {tab==='live'&&<div>
          {gwAwards&&<div className="awards">
            <div className="award"><span className="award-icon">🏆</span><div><div className="award-label">Highest Scorer</div><div className="award-val">{displayName(mgr(gwAwards.best.id))} — <span style={{color:'var(--acc)'}}>{gwAwards.best.s} pts</span></div></div></div>
            <div className="award"><span className="award-icon">🤏</span><div><div className="award-label">Closest Match</div><div className="award-val">{gwAwards.closest.ids?.map(id=>getShort(mgr(id))).join(' vs ')} — {gwAwards.closest.sc}</div></div></div>
            <div className="award"><span className="award-icon">💥</span><div><div className="award-label">Biggest Win</div><div className="award-val">{displayName(mgr(gwAwards.biggest.id))} — {gwAwards.biggest.sc}</div></div></div>
          </div>}
          {gwMatches.length===0&&<div style={{textAlign:'center',color:'var(--t2)',padding:40}}>No matches for GW{gw}</div>}
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {gwMatches.map((m,i)=>{
              const e1=mgr(m.league_entry_1),e2=mgr(m.league_entry_2);
              const isLive=m.started&&!m.finished;
              const lp1=getLive(m.league_entry_1,m.event),lp2=getLive(m.league_entry_2,m.event);
              const p1=(isLive&&lp1!==null)?lp1:(m.league_entry_1_points||0);
              const p2=(isLive&&lp2!==null)?lp2:(m.league_entry_2_points||0);
              const hW=p1>p2,aW=p2>p1,dr=p1===p2,tot=p1+p2||1;
              const isExp=expanded===i;
              const k1=m.league_entry_1+'-'+m.event,k2=m.league_entry_2+'-'+m.event;
              const av1=e1&&isAvg(e1),av2=e2&&isAvg(e2);
              return(
                <div key={i} className="card">
                  <div className="match" onClick={()=>{if(isExp)setExpanded(null);else{setExpanded(i);loadMatchPicks(m)}}}>
                    {isLive&&<div className="live-dot"><div className="pulse"/><span className="live-txt">Live</span></div>}
                    <div className="match-teams">
                      <div className="match-side"><div className={'match-name'+(av1?' avg-team':'')} style={{color:hW?'var(--acc)':'var(--t2)'}}>{av1?'League Average':getName(e1)}</div><div className="match-pts" style={{color:hW?'var(--acc)':dr?'var(--text)':'var(--t2)'}}>{p1}</div></div>
                      <div className="match-vs">vs</div>
                      <div className="match-side"><div className={'match-name'+(av2?' avg-team':'')} style={{color:aW?'var(--acc)':'var(--t2)'}}>{av2?'League Average':getName(e2)}</div><div className="match-pts" style={{color:aW?'var(--acc)':dr?'var(--text)':'var(--t2)'}}>{p2}</div></div>
                    </div>
                    <div className="bar-track"><div className="bar-fill" style={{width:(p1/tot*100)+'%',background:hW?'var(--acc)':dr?'var(--t2)':'var(--red)'}}/><div className="bar-fill" style={{width:(p2/tot*100)+'%',background:aW?'var(--acc)':dr?'var(--t2)':'var(--red)'}}/></div>
                    <div className="tap-hint">Tap for squad breakdown</div>
                  </div>
                  {isExp&&<div className="expand">
                    {[{lid:m.league_entry_1,k:k1},{lid:m.league_entry_2,k:k2}].map(({lid,k})=>{
                      const mg=mgr(lid),tp=picks[k],ld=picksLoading[k];
                      const team=tp?calcTeam(tp,liveData,bootstrap):null;
                      const av=mg&&isAvg(mg);
                      return<div key={k}>
                        <div className="exp-title" style={av?{fontStyle:'italic',opacity:.5}:{}}>{av?'League Average':mg?getName(mg):'Team'}</div>
                        {ld&&<div style={{color:'var(--t2)',fontSize:10}}>Loading...</div>}
                        {!ld&&!team&&<div style={{color:'var(--t2)',fontSize:10}}>Unavailable</div>}
                        {team&&<>
                          {team.starters.sort((a,b)=>a.type-b.type).map((p,j)=><PR key={j} p={p}/>)}
                          <div style={{fontSize:9,color:'var(--t3)',marginTop:6,marginBottom:2,textTransform:'uppercase',letterSpacing:.8}}>Bench</div>
                          {team.bench.map((p,j)=><PR key={j} p={p}/>)}
                        </>}
                      </div>;
                    })}
                  </div>}
                </div>
              );
            })}
          </div>
        </div>}

        {/* ═══ STANDINGS ═══ */}
        {tab==='standings'&&<div>
          <div className="tbl-wrap"><table><thead><tr>
            {['#','Team','W','D','L','Pts','PF','PA','±','Avg','Form'].map(h=><th key={h} style={{textAlign:h==='Team'?'left':'center'}}>{h}</th>)}
          </tr></thead><tbody>
            {enrichedStandings.map((s,i)=>{
              const e=mgr(s.league_entry),av=e&&isAvg(e),pts=s.matches_won*3+s.matches_drawn,form=(s.results||[]).slice(-5);
              return<tr key={s.league_entry} style={{background:i===0?'rgba(0,255,135,.03)':'transparent'}}>
                <td style={{textAlign:'center',fontWeight:800,color:i===0?'var(--acc)':i>=entries.length-1?'var(--red)':'var(--t2)'}}>{i+1}</td>
                <td style={{fontWeight:700,fontSize:11,whiteSpace:'nowrap'}} className={av?'avg-team':''}>{av?'League Average':getName(e)}</td>
                <td style={{textAlign:'center',color:'var(--acc)',fontWeight:600}}>{s.matches_won}</td>
                <td style={{textAlign:'center',color:'var(--t2)'}}>{s.matches_drawn}</td>
                <td style={{textAlign:'center',color:'var(--red)'}}>{s.matches_lost}</td>
                <td style={{textAlign:'center',fontWeight:900,fontSize:14}}>{pts}</td>
                <td style={{textAlign:'center',fontVariantNumeric:'tabular-nums'}}>{s.pf}</td>
                <td style={{textAlign:'center',fontVariantNumeric:'tabular-nums',color:'var(--t2)'}}>{s.pa}</td>
                <td style={{textAlign:'center',fontWeight:700,color:s.diff>0?'var(--acc)':s.diff<0?'var(--red)':'var(--t2)'}}>{s.diff>0?'+':''}{s.diff}</td>
                <td style={{textAlign:'center',fontVariantNumeric:'tabular-nums'}}>{s.avg}</td>
                <td style={{textAlign:'center'}}><div className="form-dots">{form.map((r,j)=><div key={j} className="fdot" style={{background:r==='W'?'var(--acc)':r==='L'?'var(--red)':'#6b7280'}}/>)}</div></td>
              </tr>;
            })}
          </tbody></table></div>
        </div>}

        {/* ═══ STATS ═══ */}
        {tab==='stats'&&<div>
          {finishedMatches.length===0?<div style={{textAlign:'center',color:'var(--t2)',padding:40}}>No completed gameweeks yet</div>:<>
            <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:16}}>
              <div className="stat-card" style={{flex:'1 1 140px'}}><div className="stat-icon">🏆</div><div className="stat-label">Highest GW</div><div className="stat-val" style={{color:'var(--acc)'}}>{records.hi.s}</div><div className="stat-sub">{displayName(mgr(records.hi.id))} — GW{records.hi.gw}</div></div>
              <div className="stat-card" style={{flex:'1 1 140px'}}><div className="stat-icon">📉</div><div className="stat-label">Lowest GW</div><div className="stat-val" style={{color:'var(--red)'}}>{records.lo.s}</div><div className="stat-sub">{records.lo.id?displayName(mgr(records.lo.id)):''}{records.lo.gw?' — GW'+records.lo.gw:''}</div></div>
              <div className="stat-card" style={{flex:'1 1 140px'}}><div className="stat-icon">💥</div><div className="stat-label">Biggest Win</div><div className="stat-val" style={{color:'var(--cyan)'}}>{records.big.sc||'–'}</div><div className="stat-sub">{records.big.id?displayName(mgr(records.big.id)):''}{records.big.gw?' — GW'+records.big.gw:''}</div></div>
            </div>
          </>}
        </div>}

        {/* ═══ H2H GRID ═══ */}
        {tab==='h2h'&&<div>
          <div className="section">Head-to-Head Records</div>
          {finishedMatches.length===0?<div style={{textAlign:'center',color:'var(--t2)',padding:40}}>No completed gameweeks yet</div>:
          <div className="tbl-wrap"><table style={{fontSize:10}}><thead><tr>
            <th style={{position:'sticky',left:0,background:'var(--bg)',zIndex:2,minWidth:36}}></th>
            {entries.map(e=><th key={e.id} style={{textAlign:'center',minWidth:48}}>{isAvg(e)?'AVG':getShort(e)}</th>)}
          </tr></thead><tbody>
            {entries.map(e1=>{const av1=isAvg(e1);return<tr key={e1.id}>
              <td style={{fontWeight:700,color:av1?'var(--t3)':'var(--acc)',position:'sticky',left:0,background:'var(--s1)',zIndex:1,fontSize:10}} className={av1?'avg-team':''}>{av1?'AVG':getShort(e1)}</td>
              {entries.map(e2=>{
                if(e1.id===e2.id)return<td key={e2.id} className="h2h-cell" style={{background:'var(--s2)'}}>—</td>;
                const r=h2hGrid[e1.id]?.[e2.id];if(!r)return<td key={e2.id} className="h2h-cell">-</td>;
                const bg=r.w>r.l?'rgba(0,255,135,.07)':r.l>r.w?'rgba(255,71,87,.07)':'transparent';
                return<td key={e2.id} className="h2h-cell" style={{background:bg}}><span style={{color:'var(--acc)',fontWeight:700}}>{r.w}</span><span style={{color:'var(--t3)'}}>{'-'+r.d+'-'}</span><span style={{color:'var(--red)',fontWeight:700}}>{r.l}</span></td>;
              })}
            </tr>})}
          </tbody></table></div>}
          <div style={{marginTop:6,fontSize:10,color:'var(--t3)'}}>W-D-L from row team's view • Completed GWs only</div>
        </div>}
      </div>
      <div className="footer">v2.0 • League {LEAGUE_ID}</div>
    </div>
  );
}
ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
